name: collect

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect fee payments
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          FEE_WALLET: ${{ secrets.FEE_WALLET }}
        run: node collect.mjs
      - name: Commit the database
        run: |
          git config user.name "lp-dash bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/db.enc
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
